# e6_preregistration.yaml — the E6 contrasts and go/no-go criteria (WP10).
#
# v4. Supersedes v3 by RESOLVING the four open decisions it carried — D1 (primary topology
# metric), D2 (e6a_3), D3 (e6a_4) and D4 (e6b_1/e6b_2) of
# `new_design_plans/DECISIONS_REQUIRED.md`. Every resolution is recorded in `amendments:`
# with its date and reasoning. NO RESULTS EXISTED WHEN THESE WERE MADE: the E6A pilot had
# not been trained, and `transformation_inheritance/results/` held nothing but a public
# TinyStories-8M reference row that none of these four criteria reads. That ordering is the
# whole content of a pre-registration (05 §6) and is asserted, not merely claimed — see the
# amendment entries.
#
# D2, D3 and D4's magnitude take framing (B): they pre-register a RULE (a threshold
# calibrated against the metric's own across-seed null spread), not a number. The number
# each rule yields is a RESULT and is written into `go_no_go.json` beside the rule, never
# back into this file.
#
# v3 superseded v2, which was reviewed and found to contain three defects:
#   (1) wrong corpus_id literals in the cross-domain contrast;
#   (2) a threshold rationale that silently changed scale — §6.4's intervention-residual
#       categories are ratios A_j/A_baseline, while fingerprint and functional similarity
#       are cosines between vectors of those ratios. The two are not comparable and v2's
#       0.90/0.60 justification is withdrawn;
#   (3) a topology metric presented as a transcription when it is a decision.
#
# TRANSCRIPTION SOURCE: FULL_EXPERIMENT_DESIGN_SINK_INHERITANCE.md §8.7 and §18.
# Entries marked `source:` are verbatim from that document.
# Entries marked `status: PENDING_DECISION_*` are NOT transcriptions. The design leaves
# them open; choosing them is a scientific decision that must be made and recorded in
# `amendments:` BEFORE results exist (05 §6). No number below is presented as derived.
#
# SCHEMA COMPATIBILITY: entries using `kind:`, `absolute_difference:`, `seed_consistency:`,
# `compound:` or `condition_a: P8M` require the WP12 aggregator extension
# (`new_design_plans/08_AGGREGATOR_EXTENSION_SPEC.md`). Every such entry carries a
# `requires:` line naming what it needs. Entries without one run on today's aggregator.

version: e6_prereg_v4

# ──────────────────────────────────────────────────────────────────────────────
# Corpus identifiers — verified against common/corpus_providers.py, not assumed.
#   tinystories_corpus  -> f"tinystories_{split}_{purpose}_{n_blocks}"
#   frozen_e1_corpus    -> f"e1_{sample_size}x{cut_length}"
# Referenced symbolically below so a provider change breaks loudly in one place.
# ──────────────────────────────────────────────────────────────────────────────

corpora:
  in_domain: tinystories_validation_sink_300
  cross_domain: e1_100x40
  source: "common/corpus_providers.py — literals verified, not inferred from the spec pack"

# ──────────────────────────────────────────────────────────────────────────────
# Contrasts → e6a_contrasts.csv          (design §8.7, "Primary E6A contrasts")
# ──────────────────────────────────────────────────────────────────────────────

contrasts:
  - id: e6a_c1
    text: "D2 - D0 in teacher-student fingerprint cosine similarity at step 10,000"
    metric: fingerprint_cosine_to_teacher
    condition_a: D2
    condition_b: D0
    selection: equal_step
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: >
      design §8.7 contrast 1, verbatim: "`D2 - D0` in teacher-student fingerprint cosine
      similarity at step 10,000."

  - id: e6a_c2
    text: "D1 - D0 in functional similarity at matched validation CE"
    metric: functional_cosine_to_teacher
    condition_a: D1
    condition_b: D0
    selection: matched_loss
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: >
      design §8.7 contrast 2, verbatim: "`D1 - D0` in functional similarity at matched
      validation CE." Metric is the ΔCE-vector cosine of design §6.5.
    requires: >
      PAIR-SPECIFIC MATCHED LOSS. §8.7 says "at matched validation CE", i.e. D1 and D0
      compared where their own CEs coincide. `build_matched_loss` currently matches every
      condition to a single `reference_condition` (D0's final CE). For a D1-vs-D0 contrast
      those coincide; for e6a_c4a/c4b they do not. See 08 §3.

  - id: e6a_c3
    text: "D2 - D1 in topological similarity (Spearman form)"
    metric: topology_spearman_to_teacher
    condition_a: D2
    condition_b: D1
    selection: equal_step
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: >
      design §8.7 contrast 3, verbatim: "`D2 - D1` in topological similarity."
      §6.3 defines THREE topology measures (Spearman correlation, normalised area
      difference, 1-D Wasserstein) and §8.7 names none of them. Both computable forms are
      registered here so neither can be selected after the fact; which one the paper
      reports as primary is a decision — see `primary_topology_metric` below.

  - id: e6a_c3b
    text: "D2 - D1 in topological distance (Wasserstein form)"
    metric: topology_wasserstein_to_teacher
    condition_a: D2
    condition_b: D1
    selection: equal_step
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: "companion to e6a_c3; registered in advance, see e6a_c3"

  - id: e6a_c4a
    text: "public independently trained 8M vs D1 at matched validation CE"
    metric: fingerprint_cosine_to_teacher
    condition_a: P8M
    condition_b: D1
    selection: matched_loss
    matched_loss_reference: D1
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: >
      design §8.7 contrast 4, verbatim: "Public independently trained 8M versus D1 and D2
      at matched validation CE." Split into c4a/c4b because the aggregator's contrast unit
      is one condition pair.
    requires: >
      (a) P8M ROWS. roneneldan/TinyStories-8M must be fingerprinted through
      evaluate_transformation.py against the same teacher, corpora, band and registry, and
      written with condition "P8M". It has one checkpoint and no seeds; see 08 §4 for how
      a seedless condition is paired against a three-seed one.
      (b) PAIR-SPECIFIC MATCHED LOSS via `matched_loss_reference`. P8M has a fixed CE; the
      matched checkpoint must be D1's checkpoint nearest P8M's CE, not D0's final CE.
      Design §8.1: P8M is an independent-convergence reference and NEVER initialises a
      student.

  - id: e6a_c4b
    text: "public independently trained 8M vs D2 at matched validation CE"
    metric: fingerprint_cosine_to_teacher
    condition_a: P8M
    condition_b: D2
    selection: matched_loss
    matched_loss_reference: D2
    corpus_id: tinystories_validation_sink_300
    family: e6a_primary
    source: "design §8.7 contrast 4 (second half); see e6a_c4a"
    requires: "see e6a_c4a"

  - id: e6a_c5
    kind: corpus_pair
    text: "in-domain versus cross-domain inheritance"
    metric: fingerprint_cosine_to_teacher
    conditions: [D0, D1, D2]
    corpus_a: tinystories_validation_sink_300
    corpus_b: e1_100x40
    selection: equal_step
    family: e6a_primary
    source: >
      design §8.7 contrast 5, verbatim: "In-domain versus cross-domain inheritance."
      Design §8.2: the in-domain set measures inheritance under the training distribution;
      the cross-domain set tests whether any inherited fingerprint generalises beyond
      TinyStories. §16.1 lists this as the control for the confound that attention KD
      directly optimises the measured maps.
    requires: >
      `kind: corpus_pair` (08 §2). Pairs two CORPORA within each condition, not two
      conditions within one corpus. Corpus literals verified against corpus_providers.py.

# ──────────────────────────────────────────────────────────────────────────────
# Reporting decision, not a contrast.
# ──────────────────────────────────────────────────────────────────────────────

primary_topology_metric:
  chosen: topology_wasserstein_to_teacher
  decided: "2026-07-30"
  decision_id: D1
  rationale: >
    The paper's §24 claim is that sink anchors are CONSERVED ROLES, not co-varying
    profiles — so *where in depth* the anchor sits is the substance of the claim, and
    Wasserstein is the only registered form sensitive to it. Spearman would score a
    teacher-like profile shifted to the wrong depth as highly similar, which is precisely
    the failure the claim must be able to detect. The argument for Spearman was that its
    sign runs the same way as e6a_c1/e6a_c2; that is presentation, and presentation should
    not choose a scientific measure. Consequence accepted: e6a_c3 is a DISTANCE, so lower
    is more similar and its sign is inverted relative to c1/c2 — figures and table 2 must
    label it as such. e6a_c3b (Spearman) is still computed and reported as secondary.
  options: [topology_spearman_to_teacher, topology_wasserstein_to_teacher,
            topology_area_diff_to_teacher]
  note: >
    §6.3 defines three; §8.7 names none. Spearman is the only one of the three that is a
    *similarity* (higher = more alike), so registering it as primary keeps e6a_c3's sign
    aligned with e6a_c1 and e6a_c2 — that is an argument about presentation, not about
    which measure is scientifically right, and it is offered as such. Wasserstein is
    sensitive to where in depth the profiles differ, which Spearman is not; if the paper's
    claim is about *where* the anchor sits rather than whether the profiles co-vary,
    Wasserstein is the better primary. Decide and record in `amendments:`.
    `topology_area_diff_to_teacher` is listed for completeness; it is not currently a
    column in checkpoint_metrics.csv and would need adding (08 §6).

# ──────────────────────────────────────────────────────────────────────────────
# Go/no-go → go_no_go.json               (design §18, "Continue E6A ... when")
#
# Design §18, verbatim: "At least one of the following is observed ACROSS ALL THREE SEEDS".
# The aggregator's `n_met >= 1 -> continue` matches the "at least one" half. The
# "across all three seeds" half is NOT enforced today — `evaluate_criterion` sets `met`
# from the pooled `mean_diff` while recording `all_seeds` unused, so a criterion can pass
# on one strong seed. `seed_consistency: all` below requires 08 §5.
# ──────────────────────────────────────────────────────────────────────────────

go_no_go:
  - id: e6a_1
    text: "D2 improves teacher fingerprint similarity over D0 by at least 0.15"
    metric: fingerprint_cosine_to_teacher
    condition_a: D2
    condition_b: D0
    selection: equal_step
    corpus_id: tinystories_validation_sink_300
    threshold: 0.15
    direction: greater_equal
    seed_consistency: all
    family: e6a_go_no_go
    source: "design §18 criterion 1, verbatim"
    requires: "seed_consistency (08 §5)"

  - id: e6a_2
    text: >
      D1 and D2 have similar validation CE but differ in mechanistic inheritance by at
      least 0.10
    metric: fingerprint_cosine_to_teacher
    condition_a: D2
    condition_b: D1
    selection: matched_loss
    corpus_id: tinystories_validation_sink_300
    threshold: 0.10
    direction: greater_equal
    absolute_difference: true
    seed_consistency: all
    family: e6a_go_no_go
    source: >
      design §18 criterion 2, verbatim: "D1 and D2 have similar validation CE but differ
      in mechanistic inheritance by at least 0.10."
    operationalisation: >
      DECISION, recorded: "similar validation CE" is read as the §6.4 matched-loss
      selection (refused above a 0.05-nat realised gap) rather than as a separate
      similarity test, and "differ by" as |D2 - D1| since the criterion is directionless.
      The 0.10 magnitude is the design's own and is not a decision.
    requires: "absolute_difference (08 §2), seed_consistency (08 §5)"

  - id: e6a_3
    decided: "2026-07-30"
    decision_id: D2
    text: "functional inheritance remains high while mechanistic inheritance is low"
    compound:
      all_of:
        # "HIGH" = within k null spreads of perfect similarity (anchor 1.0).
        - metric: functional_cosine_to_teacher
          condition_a: D1
          selection: equal_step
          corpus_id: tinystories_validation_sink_300
          direction: greater_equal
          threshold_rule:
            kind: null_seed_spread
            metric: functional_cosine_to_teacher
            null_condition: D0
            statistic: range
            anchor: 1.0
            anchor_side: below
            k: 2.0
        # "LOW" = more than k null spreads BELOW that same boundary. One boundary read
        # from its two sides, which is what makes "high" and "low" a single calibration
        # rather than two independent judgements.
        - metric: fingerprint_cosine_to_teacher
          condition_a: D1
          selection: equal_step
          corpus_id: tinystories_validation_sink_300
          direction: less_equal
          threshold_rule:
            kind: null_seed_spread
            metric: fingerprint_cosine_to_teacher
            null_condition: D0
            statistic: range
            anchor: 1.0
            anchor_side: below
            k: 2.0
    seed_consistency: all
    family: e6a_go_no_go
    source: >
      design §18 criterion 3, verbatim: "Functional inheritance remains high while
      mechanistic inheritance is low." The design gives NO numeric boundary for "high" or
      "low" — not in §18, not in §6.4, not in §8.8.
    decision_taken: >
      D2, decided 2026-07-30 before any E6A run existed. FRAMING (B), k = 2, statistic
      `range`, null condition D0.
      Rejected (A) FIXED: v2's 0.90/0.60 was justified by §6.4's intervention-residual
      categories, and that justification is withdrawn as a scale error — §6.4's bands are
      ratios A_j/A_baseline for a single intervention, while these metrics are cosines
      between vectors of such ratios. With that rationale gone, any fixed pair would be
      bare judgement, and "where did 0.90 come from?" would have no answer.
      Chose (B) because it pre-registers a RULE and lets the NUMBER be a result: "high"
      means within 2 across-seed ranges of 1.0, "low" means more than 2 below it. The
      spread is measured D0-versus-D0 across seeds, which does not involve the D1/D2
      comparison the criterion tests, so calibrating cannot leak the outcome. k = 2
      matches `onset_threshold_k` below, so one calibration convention governs the paper.
      KNOWN PROPERTY, accepted deliberately: because both limbs read the same boundary,
      "low" is satisfied by anything more than 2 null ranges below 1.0 — a weak bar if D0's
      seed spread is tiny. That is the honest consequence of defining "low" as "more than
      noise" rather than by fiat, and `go_no_go.json` records the realised number so a
      reader can see exactly how weak or strong the bar turned out to be.
      COST, accepted: the calibration refuses on fewer than three seeds, so this criterion
      stays unresolved until D0 has run at seeds 0, 1 and 2.
    requires: "compound criteria (08 §2), seed_consistency (08 §5), threshold_rule (08 §7)"

  - id: e6a_4
    decided: "2026-07-30"
    decision_id: D3
    text: >
      the independently trained public 8M and distilled students reach similar function
      through measurably different fingerprints
    compound:
      all_of:
        # Both limbs observe |P8M − D2|, an ABSOLUTE DIFFERENCE anchored at 0 — so the
        # boundary sits ABOVE the anchor (anchor_side: above -> +k*spread). With the
        # default `below` these would resolve to −k*spread: "similar" could never be
        # satisfied and "measurably different" always would.
        # "SIMILAR FUNCTION" = the two differ by no more than k null spreads.
        - metric: functional_cosine_to_teacher
          condition_a: P8M
          condition_b: D2
          selection: matched_loss
          matched_loss_reference: D2
          corpus_id: tinystories_validation_sink_300
          direction: less_equal
          absolute_difference: true
          threshold_rule:
            kind: null_seed_spread
            metric: functional_cosine_to_teacher
            null_condition: D0
            statistic: range
            anchor: 0.0
            anchor_side: above
            k: 2.0
        # "MEASURABLY DIFFERENT FINGERPRINTS" = they differ by MORE than k null spreads.
        # Same null spread as e6a_3 by construction, so the paper has one notion of
        # "more than noise" (DECISIONS_REQUIRED D3).
        - metric: fingerprint_cosine_to_teacher
          condition_a: P8M
          condition_b: D2
          selection: matched_loss
          matched_loss_reference: D2
          corpus_id: tinystories_validation_sink_300
          direction: greater_equal
          absolute_difference: true
          threshold_rule:
            kind: null_seed_spread
            metric: fingerprint_cosine_to_teacher
            null_condition: D0
            statistic: range
            anchor: 0.0
            anchor_side: above
            k: 2.0
    seed_consistency: all
    family: e6a_go_no_go
    source: >
      design §18 criterion 4, verbatim: "The independently trained public 8M and distilled
      students reach similar function through measurably different fingerprints."
      This is the criterion that would support §20's Narrative B (convergent
      reconstruction rather than teacher-specific inheritance).
    decision_taken: >
      D3, decided 2026-07-30 before any E6A run existed. FRAMING (B), k = 2, statistic
      `range`, null condition D0 — the SAME null spread e6a_3 uses, so the paper has a
      single notion of "more than noise", as DECISIONS_REQUIRED D3 asks.
      The two limbs run opposite ways and that opposition is the entire content of the
      criterion: "similar function" is a SMALL absolute difference (less_equal) and
      "measurably different fingerprints" is a LARGE one (greater_equal). Both are
      absolute differences, so both are anchored at 0 with `anchor_side: above`.
      RECORDED APPROXIMATION: the null spread is the across-seed spread of ONE condition,
      while the observed quantity is a difference between two independently trained runs,
      whose sampling spread is larger by roughly sqrt(2). k = 2 is applied to the raw
      spread rather than to sqrt(2)*spread, which makes "measurably different" slightly
      easier and "similar function" slightly harder to satisfy. Chosen for consistency
      with e6a_3 over nominal exactness; stated here so it is not mistaken for an
      oversight, and `go_no_go.json` records the realised spread either way.
    requires: "see e6a_3, plus P8M rows and pair-specific matched loss (08 §3, §4)"

# ──────────────────────────────────────────────────────────────────────────────
# E6B go/no-go                            (design §18, "Continue E6B ... when")
# Transcribed before WP6 exists so the trainer is written against a fixed target.
# §18 states these as a conjunction — all three must hold.
# ──────────────────────────────────────────────────────────────────────────────

e6b_go_no_go:
  combine: all
  criteria:
    - id: e6b_1
      decided: "2026-07-30"
      decision_id: D4
      text: "clean LoRA and full fine-tuning reach comparable task accuracy"
      metric: task_accuracy
      condition_a: F1
      condition_b: F2
      threshold: 0.02
      direction: less_equal
      absolute_difference: true
      source: "design §18 E6B bullet 1, verbatim"
      decision_taken: >
        D4 (first half), decided 2026-07-30 before any E6B run existed. FIXED at 0.02,
        and fixed rather than calibrated because this limb — alone among the four — has a
        real EXTERNAL anchor that does not depend on our own runs: SST-2's validation
        split is 872 examples, so the binomial standard error at ~90% accuracy is
        sqrt(0.9*0.1/872) ~= 1.0 accuracy point, and a 2-point band is ~2 SE. "Comparable"
        therefore means "within about twice the measurement error of the benchmark
        itself", which is a sentence the paper can defend without appeal to our data.
        Calibrating this one against a clean-run spread would have been circular where a
        published-benchmark anchor was available.

    - id: e6b_2
      decided: "2026-07-30"
      decision_id: D4
      text: "their fingerprint or topology drift differs consistently"
      metric: fingerprint_drift_from_base
      condition_a: F2
      condition_b: F1
      direction: greater_equal
      seed_consistency: all
      # The observed quantity is (F2 drift − F1 drift), a difference anchored at 0, so the
      # bar sits ABOVE the anchor. `std` rather than `range` because the design's own E6B
      # convention (`onset_threshold_k` below) is a mean + 2 SD bar, and reusing it keeps
      # one convention across the E6B analysis.
      threshold_rule:
        kind: null_seed_spread
        metric: fingerprint_drift_from_base
        null_condition: F1
        statistic: std
        anchor: 0.0
        anchor_side: above
        k: 2.0
      source: "design §18 E6B bullet 2, verbatim"
      decision_taken: >
        D4 (second half), decided 2026-07-30 before any E6B run existed. FRAMING (B),
        k = 2, statistic `std`, null condition F1 (clean LoRA).
        "Consistently" is operationalised as `seed_consistency: all` — that half is a
        reading of the word and not a number, and it was already registered. The
        MAGNITUDE is the decision, and it reuses `onset_threshold_k: 2.0` below, which
        already defines a clean-run mean + 2 SD bar for E6B drift. So the criterion reads:
        full fine-tuning's drift exceeds LoRA's by more than twice the across-seed
        standard deviation of the clean LoRA arm, in every seed. Reusing the existing
        constant costs nothing and means E6B has exactly one notion of "beyond clean-run
        variation".
        COST, accepted: as with e6a_3, the calibration refuses on fewer than three seeds,
        so this criterion stays unresolved until F1 has run at seeds 0, 1 and 2.

    - id: e6b_3
      text: >
        corrupted training separates from clean training before or independently of final
        accuracy
      metric: drift_onset_step
      evaluation: early_warning
      min_seeds: 2
      require_both_adaptation_methods: true
      source: >
        design §18 E6B bullet 3, verbatim, operationalised by design §9.8: supported only
        if sink drift separates corrupted from clean before ordinary task accuracy does,
        in at least 2 of 3 seeds AND in both LoRA and full fine-tuning. Those quantifiers
        ARE in the design and need no decision.

e6b:
  drift_columns: [fingerprint_drift_from_base, topology_drift_from_base,
                  carrier_drift_from_base]
  onset_threshold_k: 2.0
  factorial:
    row_factor: adaptation
    column_factor: label_quality
    conditions: {F1: [lora, clean], F2: [full, clean],
                 F3: [lora, corrupt], F4: [full, corrupt]}

# ──────────────────────────────────────────────────────────────────────────────
# Stop / downgrade conditions             (design §18, "Stop or downgrade ... when")
# Reported as observations, not as a computed verdict.
# ──────────────────────────────────────────────────────────────────────────────

stop_conditions:
  - id: e6_stop_1
    text: "differences are limited to baseline sink strength"
    source: "design §18, stop bullet 1"
  - id: e6_stop_2
    text: "effects vanish under matched-loss or matched-length controls"
    source: "design §18, stop bullet 2"
  - id: e6_stop_3
    text: "only one model size or language produces the effect"
    source: "design §18, stop bullet 3"
  - id: e6_stop_4
    text: "semantic retrieval is positive but causal patches are null"
    source: "design §18, stop bullet 4 (E7-side; recorded for completeness)"
  - id: e6_stop_5
    text: "parity cannot be established for the patched quantities"
    source: "design §18, stop bullet 5"

stop_conditions_note: >
  design §18 closing sentence, verbatim: "A clean negative result may still support a
  focused paper if it establishes that sink function is reconstructed independently and
  semantic sink states do not transfer causally."

analysis:
  matched_loss_max_gap_nats: 0.05
  max_failure_rate: 0.02
  bootstrap_n: 10000
  bootstrap_alpha: 0.05
  bh_alpha: 0.05

amendments:
  - date: "2026-07-29"
    kind: transcription
    text: >
      Design §8.7 and §18 transcribed from FULL_EXPERIMENT_DESIGN_SINK_INHERITANCE.md,
      absent from the repository when v1 was written. v1's e6a_c2/c3/c4 were guesses (all
      fingerprint-cosine, equal-step); §8.7 varies both metric and selection. No results
      existed at transcription time. (Date recorded 2026-07-30 from the commit that
      introduced the v3 files, c65c2d0; the placeholder it replaces was never filled.)
  - date: "2026-07-29"
    kind: correction
    text: >
      v2 -> v3: corpus_id literals corrected to the values corpus_providers.py actually
      emits (tinystories_validation_sink_300, e1_100x40); v2's 0.90/0.60 threshold
      rationale withdrawn as a scale error and those criteria returned to undecided; the
      topology metric reclassified from transcription to decision. No results existed.

  # ── v3 -> v4: the four open decisions, all made before any E6 run existed ──────
  #
  # PRE-REGISTRATION ORDER, stated so it can be checked rather than trusted: at the time
  # these four were decided, transformation_inheritance/results/ contained only a public
  # TinyStories-8M reference (condition P8M, checkpoint_step -1) and one exploratory E6B
  # F1/seed0 run, both since moved to results/_exploratory/. No D0, D1 or D2 checkpoint
  # had been trained, so none of the quantities e6a_3/e6a_4 test had ever been computed.
  # e6b_1/e6b_2 likewise predate every F1-F4 production run.

  - date: "2026-07-30"
    kind: decision
    decision_id: D1
    text: >
      primary_topology_metric := topology_wasserstein_to_teacher. §8.7 says "topological
      similarity" and names none of §6.3's three measures. Chose Wasserstein because the
      paper's §24 claim is about anchors as conserved roles, which is a claim about WHERE
      in depth the anchor sits — and Spearman, being a rank correlation, would score a
      teacher-like profile shifted to the wrong depth as highly similar. The competing
      argument for Spearman was that its sign matches e6a_c1/c2; that is presentation and
      should not choose a measure. Both forms remain computed (e6a_c3 / e6a_c3b); this
      names which is primary. Consequence: e6a_c3 is a distance, so its sign is inverted
      relative to c1/c2 and must be labelled as such in table 2 and the figures.
      Not blocking; recorded before results either way.

  - date: "2026-07-30"
    kind: decision
    decision_id: D2
    text: >
      e6a_3 := framing (B), calibrated null, k = 2, statistic `range`, null condition D0,
      anchor 1.0, anchor_side below on both limbs. The design gives no numeric boundary
      for "high" or "low" anywhere (§18, §6.4, §8.8), and v2's 0.90/0.60 rationale was
      withdrawn as a scale error, so a fixed pair would have been bare judgement. Framing
      (B) registers a RULE and lets the number be a result; the spread is measured
      D0-versus-D0 across seeds, which does not involve the D1/D2 comparison the criterion
      tests. k = 2 matches onset_threshold_k so one convention governs the paper. Accepted
      consequences: the criterion is unresolved until D0 has three seeds, and "low" is a
      weak bar when D0's spread is small — both visible in go_no_go.json's realised
      numbers. See the entry's `decision_taken` for the full argument.

  - date: "2026-07-30"
    kind: decision
    decision_id: D3
    text: >
      e6a_4 := framing (B) on the same D0 null spread as e6a_3, k = 2, statistic `range`,
      anchor 0.0, anchor_side ABOVE on both limbs. Both limbs observe |P8M - D2|, an
      absolute difference anchored at 0, so the boundary must sit above the anchor: the
      pre-existing `anchor - k*spread` form would have made "similar function" (less_equal)
      unsatisfiable and "measurably different" (greater_equal) trivially true — two
      criteria that silently cannot fail. `anchor_side` was added to
      aggregate_transformation.resolve_threshold_rule for this, additively, defaulting to
      the previous behaviour, with tests/test_threshold_rule.py asserting that an omitted
      field changes nothing and an unrecognised one is refused. Sharing e6a_3's null gives
      the paper one notion of "more than noise", as DECISIONS_REQUIRED D3 asks. The
      sqrt(2) approximation in comparing two independent runs against a one-condition
      spread is recorded in the entry's `decision_taken` rather than silently corrected.

  - date: "2026-07-30"
    kind: decision
    decision_id: D4
    text: >
      e6b_1 := 0.02 FIXED; e6b_2 := framing (B), k = 2, statistic `std`, null condition F1,
      anchor 0.0, anchor_side above. The two halves are decided differently on purpose.
      e6b_1 has an external anchor that does not depend on our runs — SST-2 validation is
      872 examples, so the binomial SE at ~90% accuracy is ~1.0 point and 0.02 is ~2 SE —
      and calibrating against our own clean-run spread where a published-benchmark anchor
      exists would have been circular. e6b_2 has no such anchor, so it reuses the
      clean-run mean + 2 SD bar that `onset_threshold_k: 2.0` already defines for E6B
      drift. "Consistently" remains seed_consistency: all, which is a reading of the word
      and was never a number. e6b_2 is unresolved until F1 has three seeds.
