[project]
name = "kd-sink"
version = "0.0.0"
description = "Revised attention-sink inheritance experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.10.0+cu128",
    "transformers==5.3.0",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "tqdm==4.67.3",
    "datasets==4.8.4",
    "huggingface-hub==1.33.0",
    "nnsight==0.7.0",
    "peft==0.21.0",
    "PyYAML==6.0.3",
    "pyarrow==25.0.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

# Torch's CUDA 12.8 build is hosted outside PyPI. These entries let uv consume
# the project directly; pip users must pass the same URL with --extra-index-url.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
