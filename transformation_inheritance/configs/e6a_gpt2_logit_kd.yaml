# E6A-GPT2 / G1 — 0.50*L_CE + 0.50*L_KD, T=2.0
#
# The second E6A arm. Same design, different teacher: the TinyStories-33M teacher has no
# attention sink on the corpus its criteria are scored on (`baseline_sink` 0.009309 =
# 0.86x the uniform-attention floor at 128 tokens, versus a 0.15 bar), so nothing there
# could ever have been inherited. `gpt2` measures 0.563006 on `e1_100x40` — 16.5x that
# corpus's floor, with 73% of (layer, head) cells above 0.2 — and distilgpt2 0.463267, so
# this is a distillation pair with a real sink at both ends
# (`results/screening/screening_fingerprints.csv`, CLAUDE.md trap 26).
#
# The three e6a_gpt2_*.yaml files are identical except for the three loss weights; diff
# them in review to confirm that. Every hyperparameter below is the pre-registered §1.6
# block, copied verbatim from the TinyStories arm — the two arms differ in *teacher,
# student and corpus*, and in nothing else, or the comparison between them means nothing.
experiment_id: e6a_gpt2
condition: G1
teacher: gpt2
teacher_revision: null
student_config_from: distilbert/distilgpt2
student_init: random          # NEVER from_pretrained; distilgpt2 is a reference only
public_reference: distilbert/distilgpt2
tokenizer: gpt2

loss:
  ce_weight: 0.50
  kd_weight: 0.50
  attn_weight: 0.0
  temperature: 2.0
  # Teacher layer -> student layer. The teacher has 12 layers, the student 6, so the map
  # is the 12->6 analogue of design §8.3's 4->8 one: evenly spaced, ending on the last
  # layer of each. Every L_ATTN pair is global_global here — GPT-2 has no local-attention
  # layers, unlike GPT-Neo, so no pair is `mixed`.
  layer_map: {1: 0, 3: 1, 5: 2, 7: 3, 9: 4, 11: 5}

data:
  dataset: Skylion007/openwebtext
  train_split: train
  eval_split: validation
  block_size: 128
  eos_between: true
  # OpenWebText ships one `train` split of ~8M documents / ~38 GB, and GPT-2's own WebText
  # was never released — this is its open reproduction, so it is the closest available
  # in-distribution corpus for this teacher. WikiText was rejected: the GPT-2 paper states
  # WebText deliberately EXCLUDED Wikipedia, which would repeat the out-of-distribution
  # confound this arm exists to avoid.
  #
  # `train_documents` / `validation_documents` are disjoint document windows of that split
  # (datasets_loader.OPENWEBTEXT_SPLIT_WINDOWS), so a validation block can contain no
  # training token.
  #
  # The cap is sized for `optim.max_steps` (10,000 = 81.9M tokens), NOT for the 2,000-step
  # pilot, and must not be shrunk for the pilot: the packing shuffle runs over
  # range(len(documents)), so a smaller cap is a different block sequence and `--max-steps
  # 2000` would stop being a truncation of the full run. At a pessimistic 250 tokens per
  # document, 400,000 documents is 100M tokens — one epoch at 10,000 steps with headroom.
  train_documents: 400000
  validation_documents: 8000

optim:
  lr: 5.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  warmup_steps: 500
  schedule: cosine
  min_lr_ratio: 0.10
  grad_clip: 1.0
  per_device_batch_size: 16
  grad_accum: 4
  max_steps: 10000
  precision: bfloat16          # bf16 on CUDA, fp32 on CPU

# Step 0 is saved BEFORE the first optimiser update (§1.6).
checkpoints: [0, 100, 250, 500, 1000, 2000, 5000, 10000]
seeds: [0, 1, 2]

eval:
  sink_corpus: {split: validation, n_blocks: 300, purpose: sink}
  ppl_corpus:  {split: validation, n_blocks: 2000, purpose: ppl}
  ce_corpus_trajectory: {n_blocks: 300}       # design-delta D3
  ce_corpus_endpoints:  {n_blocks: 2000}
  cross_domain: frozen_e1
  # Normalised-depth band, never the legacy compute_band (CLAUDE.md trap 1). Here it gives
  # [3, 11) for the 12-layer teacher and [1, 6) for the 6-layer student.
  band_frac: [0.25, 0.90]
